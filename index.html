<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MDReader · Markdown 阅读器</title>
<link rel="stylesheet" href="assets/js/vendor/katex.min.css">
<link rel="stylesheet" href="assets/css/app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d1017'/%3E%3Cpath d='M6 22V10l5 6 5-6v12' stroke='%23ff7a45' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M20 16h6m0 0-2.6-2.8M26 16l-2.6 2.8' stroke='%23faf7f2' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
</head>
<body>
<div class="grain" aria-hidden="true"></div>

<header class="topbar">
  <a class="brand" href="#" id="brandHome" title="回到首页">
    <svg viewBox="0 0 32 32" width="22" height="22" aria-hidden="true"><rect width="32" height="32" rx="7" class="brand-tile"/><path d="M6 22V10l5 6 5-6v12" stroke="#ff7a45" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 16h6m0 0-2.6-2.8M26 16l-2.6 2.8" stroke="#faf7f2" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span class="brand-word">MD<em>Reader</em></span>
  </a>
  <div class="docmeta" id="docmeta">
    <span class="dot-sep" aria-hidden="true"></span>
    <span class="docname" id="docname">未打开文档</span>
    <span class="docstats" id="docstats"></span>
  </div>
  <div class="actions">
    <button class="btn btn-primary" id="btnOpen" type="button" title="打开文件 (Ctrl+O)">
      <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M3 7V5.5A1.5 1.5 0 0 1 4.5 4h4L11 6.5h8.5A1.5 1.5 0 0 1 21 8v9.5a1.5 1.5 0 0 1-1.5 1.5H4.2A1.2 1.2 0 0 1 3 17.8Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
      打开文件
    </button>
    <button class="btn btn-icon" id="btnPrint" type="button" title="输出为 PDF (Ctrl+P)" aria-label="输出为 PDF">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M7 8V4h10v4M7 17H5a1.6 1.6 0 0 1-1.6-1.6v-4.6A1.6 1.6 0 0 1 5 9.2h14a1.6 1.6 0 0 1 1.6 1.6v4.6A1.6 1.6 0 0 1 19 17h-2M7 13.6h10V20H7Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
    </button>
    <button class="btn btn-icon" id="btnTheme" type="button" title="切换深浅主题" aria-label="切换主题">
      <svg class="ico-sun" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12 3v2.2M12 18.8V21M3 12h2.2M18.8 12H21M5.6 5.6l1.6 1.6M16.8 16.8l1.6 1.6M18.4 5.6l-1.6 1.6M7.2 16.8l-1.6 1.6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      <svg class="ico-moon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
    </button>
  </div>
  <input type="file" id="fileInput" accept=".md,.markdown,.mdx,.mdown,.txt" hidden>
</header>

<main class="layout">
  <section class="stage">
    <div class="welcome" id="welcome">
      <div class="w-inner">
        <p class="w-kicker">MDREADER · 纯离线阅读器</p>
        <h1 class="w-title">值得认真对待的<br><span class="accent-serif">每一次阅读</span></h1>
        <p class="w-sub">为长文与代码而生：编辑部级中文排版、KaTeX 数学公式、Mermaid 流程图、语法高亮与智能大纲，全部渲染能力装进一个双击即开的页面。</p>
        <div class="w-chips" aria-hidden="true">
          <span>§ KaTeX 公式</span>
          <span>◇ Mermaid 图表</span>
          <span>⌘ 语法高亮</span>
          <span>☰ 大纲导航</span>
        </div>
        <label class="dropzone" id="dropzone" for="fileInput">
          <input type="file" id="fileInputDz" accept=".md,.markdown,.mdx,.mdown,.txt" hidden>
          <svg class="dz-arrow" viewBox="0 0 56 56" width="44" height="44" aria-hidden="true"><circle cx="28" cy="28" r="27" fill="none" stroke="currentColor" stroke-dasharray="3 5" stroke-width="1.6"/><path d="M28 38V19m0 0-6.5 6.5M28 19l6.5 6.5" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="dz-text">拖一份 <b>.md</b> 到这里<em>松手即刻开始</em></span>
        </label>
        <div class="w-recent" id="wRecent" hidden>
          <div class="w-recent-head">
            <span class="w-recent-title">最近打开</span>
            <button class="w-recent-clear" id="recentClear" type="button">清空</button>
          </div>
          <ul class="w-recent-list" id="recentList"></ul>
        </div>
        <button class="btn btn-ghost" id="btnDemo" type="button">⟡ 试用示例文档</button>
        <p class="w-fineprint">完全离线运行 · 数据不离开本机 · 文档内相对路径的本机图片暂无法加载（远程图与 base64 不受影响）</p>
      </div>
    </div>
    <article class="prose" id="article" hidden></article>
  </section>

  <aside class="toc-rail" id="tocRail">
    <div class="toc-head">目录<span class="toc-count" id="tocCount"></span></div>
    <nav class="toc" id="toc"></nav>
  </aside>
</main>

<div class="drop-overlay" id="dropOverlay" aria-hidden="true">
  <div class="do-box">
    <svg viewBox="0 0 64 64" width="64" height="64" aria-hidden="true"><path d="M8 24c0-6 4-10 10-10h2l4-5h16l4 5h2c6 0 10 4 10 10v18c0 4-3 8-8 8H16c-5 0-8-4-8-8Z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/></svg>
    <span>松开手指，开始阅读</span>
  </div>
</div>

<div class="lightbox" id="lightbox" aria-hidden="true">
  <img id="lightboxImg" alt="">
  <p class="lb-cap" id="lightboxCap"></p>
</div>

<script src="assets/js/vendor/marked.min.js"></script>
<script src="assets/js/vendor/purify.min.js"></script>
<script src="assets/js/vendor/highlight.min.js"></script>
<script src="assets/js/vendor/katex.min.js"></script>
<script src="doc-payload.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/android.js"></script>
</body>
</html>
